name: k8s-audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Audit the 44-commit dataset
        # --fail-on NONE: this is an analysis of real-world data, not a gate,
        # so known findings must not turn the build red
        run: >
          python audit.py data/commits --docker
          -o reports/commits.md
          --html reports/commits.html
          --excel reports/results.xlsx
          --by-commit reports/commits.csv
          --fail-on NONE

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: reports/
